# English text of the game's pictures (GRAPH0 textures). The build erases the Japanese
# text of each texture below and draws the English in its place (tools/texture/redraw.py,
# decisions D-019 and D-035). Hand-made PNGs in texture_overrides/ take precedence over
# a block here (D-020, D-031).
#
# One [[texture]] block per texture, sorted by name so the parts of one screen are
# together. Look at a texture with:
#   python3 tools/texture/redraw.py build/orig/GRAPH/GRAPH0.ARC build/tex_out --preview qa/tex --only 459
# (qa/tex/GRAPH0_0459.png: original left, result right; --debug marks the detected text)
#
#   entry     GRAPH0 entry number (the NNNN of GRAPH0_NNNN.png). Required.
#   name      the texture's name in the game (for reference; checked by the tests).
#   size      [width, height] in pixels (for reference; checked by the build). Coordinates
#             below count from the top left corner, x to the right, y down.
#   note      free text about the whole texture.
#
# One [[texture.line]] per piece of text, in the order of the texture:
#   japanese  the Japanese text on the original picture. Required.
#   english   the English text. "\n" starts a new line inside the same box. Required.
#   note      free text. REVIEW = the translation is uncertain, CHECK-ART = look at the result.
# Optional, only when the defaults do not work:
#   box       [left, top, right, bottom], right and bottom exclusive: where the old text is
#             and where the new text may go. Default: the whole texture, or with
#             background = "commonest" the area of that colour (a button's face).
#   background  how text is told from background, a list of
#             "transparent" (clear pixels), "commonest" (the most frequent colour in the box),
#             "edge" (the colours along the box's border) and colours "#rrggbb".
#             Default ["transparent"].
#   align     "old-text" (default: centred where the Japanese text was), "centre" (centre
#             of the box) or "left" (starts at the left edge of the box).
#   font      "SemiBold", "Bold" or "BoldItalic" (Inter). Default: Bold with an outline
#             or shadow, else SemiBold.
#   max_size  largest text height in pixels (default: from the Japanese text).
#   squeeze   narrowest horizontal squeeze before the size drops, 0.5 to 1 (default 0.85).
#   fill      text colour "#rrggbb" (default: from the Japanese text).
#   outline   ring colours from the text outwards, e.g. ["#0b537a"] (default: read from the
#             picture).
#   rings     at most this many outline rings.
#   style     "auto", "plain", "outline" or "shadow".
#   shadow    [dx, dy] shadow offset.
#   x_min, x_max  clip the default box on the left / right.
#
# [[sprite]] blocks make a picture larger on screen (D-035):
#   name      the sprite-table record, e.g. "sysgraph/menu_set2" (list them with
#             python3 tools/texture/sprites.py table build/orig/SLPS_258.50)
#   size      the new [width, height]. Each texture of the record grows by the same amount
#             on every side (even numbers), so the old picture stays where it was and the
#             new room is left and right (above and below) of it. Boxes and `size` of the
#             texture blocks then count in the larger picture. Only records the build can
#             check are allowed (tools/texture/sprites.py says why when one is refused).
#   note      free text.

# ==============================================================================
# Larger sprites (D-035)
# ==============================================================================

# Settings panel: the labels share a left edge; Rumble, Voice, BGM and Wallpaper were 40 px
# wide, Text Speed 80, so the English had to shrink or squeeze. At 120 x 32, centred where
# they were, there are 80 px (Text Speed: 100 px) right of the common left edge, short of
# the value column.
[[sprite]]
name = "sysgraph/menu_set2"
size = [120, 32]
note = "Rumble"

[[sprite]]
name = "sysgraph/menu_set3"
size = [120, 32]
note = "Voice"

